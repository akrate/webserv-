server {
    listen 8080;
    host 127.0.0.1;
    server_name localhost;

    # Default error page - ensure this path exists in your www/html
    error_page 404 /errors/404.html;

    # 1. / must answer to GET request ONLY
    location / {
        methods GET;
        root ./www/html;
        index index.html;
    }

    # 2. /directory/ must answer to GET
    # It must search for youpi.bad_extension if no file is requested
    location /directory {
        methods GET;   # <--- Add this!
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex on;
    }
    # location /directory/Yeah {
    #     methods GET;   # <--- Add this!
    #     root ./YoupiBanane;
    #     index youpi.bad_extension;
    # }
    # 3. Any file with .bla must answer to POST by calling cgi_test
    # This uses a case-sensitive regex-style match common in this project
    location ~ \.bla$ {
        methods POST;
        cgi_ext .bla;
        cgi_path ./cgi_test;
        root ./YoupiBanane;
    }

    # 4. /post_body must answer to POST with a maxBody of 100
    location /post_body {
        methods POST;
        client_max_body_size 100;
        root ./www/html;
    }

    # 5. /put_test/ (Often requested by the tester for upload tests)
    location /put_test/ {
        methods PUT;
        root ./www/html/uploads;
    }
    location /old-page {
        return 301 /new-page;
    }
}
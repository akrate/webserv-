<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>502 — Bad Gateway | WebServ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#020408;--cyan:#00f5ff;--purple:#b94fff;--green:#00ff88;
  --red:#ff2d55;--border:rgba(0,245,255,.15);--text:#c8d8e8;
  --accent:#00f5ff;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

.bg-canvas{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,245,255,.05) 0%,transparent 70%),
    radial-gradient(ellipse 50% 50% at 80% 20%, rgba(255,45,85,.05) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 20% 80%, rgba(185,79,255,.05) 0%,transparent 60%),
    #020408;
}
.grid{position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(0,245,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.04) 1px,transparent 1px);
  background-size:60px 60px;animation:gridMove 20s linear infinite;
}
@keyframes gridMove{from{transform:translateY(0)}to{transform:translateY(60px)}}

.particles{position:fixed;inset:0;z-index:0;overflow:hidden;}
.particle{
  position:absolute;border-radius:50%;
  animation:float linear infinite;opacity:0;
}
@keyframes float{
  0%{opacity:0;transform:translateY(110vh) scale(0)}
  10%{opacity:1}90%{opacity:1}
  100%{opacity:0;transform:translateY(-10vh) scale(1)}
}

.signal-lines{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sig{
  position:absolute;height:1px;
  background:linear-gradient(90deg,transparent,var(--red),transparent);
  opacity:0;
  animation:sigFlash 4s ease-in-out infinite;
}
@keyframes sigFlash{
  0%,100%{opacity:0;width:0;left:50%}
  20%{opacity:.4;width:30%;left:35%}
  40%{opacity:0;width:0;left:80%}
  60%{opacity:.3;width:20%;left:10%}
  80%{opacity:0}
}

.error-wrap{
  position:relative;z-index:1;
  text-align:center;padding:2rem;
  animation:appear .8s ease both;
}
@keyframes appear{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

.gateway-icon{
  margin-bottom:1rem;
  display:flex;align-items:center;justify-content:center;gap:.6rem;
}
.node{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--cyan);
  box-shadow:0 0 8px var(--cyan);
  animation:nodePulse 2s ease-in-out infinite;
}
.node.dead{
  border-color:var(--red);
  box-shadow:0 0 8px var(--red);
  animation:nodeDead 1.5s ease-in-out infinite;
}
.wire{width:40px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--red));position:relative;overflow:hidden;}
.wire::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,#fff 50%,transparent 100%);
  animation:wireFlicker 2s ease-in-out infinite;
}
@keyframes wireFlicker{0%,100%{transform:translateX(-100%);opacity:.4}50%{transform:translateX(100%);opacity:0}}
@keyframes nodePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes nodeDead{0%,100%{opacity:1}50%{opacity:.2}}

.code-3d{
  font-family:'Orbitron',monospace;
  font-size:clamp(8rem,22vw,16rem);
  font-weight:900;line-height:1;
  letter-spacing:-.04em;
  position:relative;display:inline-block;
  transform-style:preserve-3d;
  animation:tilt 6s ease-in-out infinite;
}
@keyframes tilt{
  0%,100%{transform:perspective(600px) rotateX(0) rotateY(-5deg)}
  50%{transform:perspective(600px) rotateX(4deg) rotateY(5deg)}
}
.code-3d .front-text{
  background:linear-gradient(135deg,#fff 0%,var(--cyan) 50%,var(--red) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 40px var(--cyan));
}
.code-3d .shadow-text{
  position:absolute;top:6px;left:6px;
  font-family:'Orbitron',monospace;
  font-size:clamp(8rem,22vw,16rem);
  font-weight:900;line-height:1;
  -webkit-text-fill-color:transparent;
  -webkit-text-stroke:1px rgba(255,45,85,.2);
  z-index:-1;
}
.code-3d::before{
  content:'502';
  position:absolute;top:0;left:-3px;
  font-family:'Orbitron',monospace;
  font-size:clamp(8rem,22vw,16rem);
  font-weight:900;line-height:1;
  letter-spacing:-.04em;
  color:var(--red);
  opacity:0;
  clip-path:inset(0 0 100% 0);
  animation:glitchSlice 5s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes glitchSlice{
  0%,90%,100%{opacity:0;clip-path:inset(0 0 100% 0)}
  91%{opacity:.6;clip-path:inset(20% 0 65% 0)}
  92%{opacity:.6;clip-path:inset(55% 0 30% 0)}
  93%{opacity:0}
  95%{opacity:.4;clip-path:inset(10% 0 80% 0)}
  96%{opacity:0}
}

.scanline{
  position:absolute;top:0;left:-10%;right:-10%;height:3px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  animation:scan 3s ease-in-out infinite;opacity:.6;
}
@keyframes scan{
  0%{top:0;opacity:0}10%{opacity:.6}90%{opacity:.6}100%{top:100%;opacity:0}
}

.glitch-label{
  font-family:'Orbitron',monospace;
  font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:.5rem;
  animation:glitch 4s ease infinite;
}
@keyframes glitch{
  0%,95%,100%{clip-path:none;transform:none}
  96%{clip-path:inset(10% 0 85% 0);transform:translate(-3px)}
  97%{clip-path:inset(60% 0 20% 0);transform:translate(3px)}
  98%{clip-path:inset(40% 0 50% 0);transform:translate(-2px)}
  99%{clip-path:none;transform:none}
}
.error-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(1.2rem,3vw,2rem);
  font-weight:700;color:#fff;margin-bottom:.8rem;
}
.error-desc{
  font-size:1.05rem;color:rgba(200,216,232,.55);
  max-width:440px;margin:0 auto 2.5rem;line-height:1.7;
  font-weight:300;
}

.divider{
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  margin:.8rem auto 1.5rem;
}

.btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.75rem 1.8rem;border-radius:.4rem;
  font-family:'Rajdhani',sans-serif;font-size:.95rem;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;transition:.3s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#000;border:none;box-shadow:0 0 30px rgba(0,245,255,.2);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(0,245,255,.35)}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--text);
  backdrop-filter:blur(8px);
}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px)}

.status-line{
  margin-top:3rem;
  display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap;
  font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(200,216,232,.3);
  border-top:1px solid rgba(0,245,255,.07);
  padding-top:2rem;
}
.status-line span{display:flex;align-items:center;gap:.4rem}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);
     box-shadow:0 0 6px var(--green);animation:blink 2s ease-in-out infinite}
.dot.err{background:var(--red);box-shadow:0 0 6px var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="grid"></div>
<div class="particles" id="particles"></div>
<div class="signal-lines" id="signals"></div>

<div class="error-wrap">
  <div class="gateway-icon">
    <div class="node"></div>
    <div class="wire"></div>
    <div class="node dead"></div>
    <div class="wire"></div>
    <div class="node"></div>
  </div>

  <div class="glitch-label">Error Code · 502</div>

  <div class="code-3d">
    <div class="scanline"></div>
    <span class="shadow-text">502</span>
    <span class="front-text">502</span>
  </div>

  <div class="divider"></div>
  <div class="error-title">Bad Gateway</div>
  <div class="error-desc">
    The upstream server returned an invalid response. The gateway could not fulfill your request — please try again shortly.
  </div>

  <div class="btn-row">
    <a href="/" class="btn btn-primary">⬡ Return Home</a>
    <a href="javascript:history.back()" class="btn btn-ghost">← Go Back</a>
  </div>

  <div class="status-line">
    <span><span class="dot"></span> Server Online</span>
    <span><span class="dot err"></span> Upstream Error</span>
    <span>WebServ / 1.0</span>
    <span>HTTP 502</span>
  </div>
</div>

<script>
const P = document.getElementById('particles');
const colors = ['#00f5ff','#b94fff','#ff2d55'];
for(let i=0;i<30;i++){
  const d=document.createElement('div');
  d.className='particle';
  const s=Math.random()*4+2;
  d.style.cssText=`
    width:${s}px;height:${s}px;
    left:${Math.random()*100}%;
    background:${colors[Math.floor(Math.random()*3)]};
    animation-duration:${Math.random()*12+8}s;
    animation-delay:${Math.random()*-15}s;
    box-shadow:0 0 ${s*3}px currentColor;
  `;
  P.appendChild(d);
}

const S=document.getElementById('signals');
for(let i=0;i<5;i++){
  const l=document.createElement('div');
  l.className='sig';
  l.style.cssText=`top:${10+i*20}%;animation-delay:${i*.8}s;animation-duration:${3+i*.5}s;`;
  S.appendChild(l);
}
</script>
</body>
</html>
